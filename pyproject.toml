[project]
name = "opengif"
version = "0.1.0"
description = "Experimental GIF captioning, frame-grid preparation, and video LoRA research tools"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.35",
    "numpy>=2",
    "peft>=0.17",
    "safetensors>=0.6",
    "tqdm>=4.67",
    "accelerate>=1.13.0",
    "aiohttp>=3.13.5",
    "bitsandbytes>=0.49.2",
    "pgvector>=0.4.2",
    "pillow>=12.2.0",
    "psycopg2-binary>=2.9.11",
    "qwen-vl-utils>=0.0.14",
    "sentence-transformers>=5.3.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.5.0",
]
